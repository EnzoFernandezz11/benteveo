[package]
name = "benteveo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aplicación de enfoque offline para Linux"

[dependencies]
directories = "5.0"
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4.11"
rodio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
